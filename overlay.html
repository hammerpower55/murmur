<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>

  <body>
    <div class="pill" id="pill" data-phase="hidden">
      <div class="view recording">
        <svg class="mic" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
        </svg>
        <div class="bars" id="bars"></div>
      </div>
      <div class="view processing">
        <div class="dots"><span></span><span></span><span></span></div>
        <span class="label">Transcribing</span>
      </div>
      <div class="view done">
        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
      </div>
      <div class="view cancelled">
        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 7l10 10M17 7L7 17" />
        </svg>
      </div>
      <div class="view error">
        <span class="label">Could not transcribe</span>
      </div>
    </div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
