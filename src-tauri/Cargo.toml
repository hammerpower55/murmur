[package]
name = "murmur"
version = "0.1.0"
description = "Offline voice dictation for Windows on ARM64"
authors = ["Murmur contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
rubato = "5.0.1"
ringbuf = "0.5.3"
anyhow = "1.0.104"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_Storage_FileSystem"] }
whisper-rs = { version = "0.16.0", features = ["log_backend"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
enigo = "0.6.1"
arboard = "3.7.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
sha2 = "0.11.1"
sha1 = "0.11.0"
hex = "0.4.3"
tauri-plugin-store = "2.5.0"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-31", "half"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
png = "0.18.1"
base64 = "0.23.1"
realfft = "3.5.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
half = "2.7.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
hound = "3.5.1"
